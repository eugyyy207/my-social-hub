
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Social Hub</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #6c36c9, #e64c91);
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 400px;
      margin: 70px auto;
    }

    h1 {
      font-size: 32px;
    }

    p {
      margin-bottom: 35px;
    }

    a {
      display: block;
      padding: 18px;
      margin: 20px 0;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      font-size: 19px;
      font-weight: bold;
    }

    .instagram {
      background: #d62976;
    }

    .facebook {
      background: #1877F2;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>My Social Hub</h1>

    <p>Welcome! Connect with us below.</p>

    <a class="instagram"
       href="https://www.instagram.com/"
       target="_blank">
       📸 Open Instagram
    </a>

    <a class="facebook"
       href="https://www.facebook.com/"
       target="_blank">
       👍 Open Facebook
    </a>

  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>

</body>
</html>
